function getZodiac(day, month) {
  const m = parseInt(month), d = parseInt(day);
  if ((m === 3 && d >= 21) || (m === 4 && d <= 19)) return ZODIAC_SIGNS[0];
  if ((m === 4 && d >= 20) || (m === 5 && d <= 20)) return ZODIAC_SIGNS[1];

  if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return ZODIAC_SIGNS[9];
  if ((m === 1 && d >= 20) || (m === 2 && d <= 18)) return ZODIAC_SIGNS[10];
  return ZODIAC_SIGNS[11];
}

function getNumerology(birthdate) {
  const digits = birthdate.replace(/-/g, "").split("").map(Number);
  let sum = digits.reduce((a, b) => a + b, 0);
  while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
    sum = sum.toString().split("").map(Number).reduce((a, b) => a + b, 0);
  }
  return sum;
}

async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: `Tu es Séraphiel, un oracle mystique ancien et bienveillant. Tu t'exprimes avec élégance, poésie et profondeur. Tes messages sont envoûtants, légèrement mystérieux, jamais alarmistes. Tu utilises un langage raffiné, des métaphores cosmiques et célestes. Tu vouvoies toujours l'utilisateur. Tu ne donnes jamais de conseils médicaux ou financiers. Tu rappelles subtilement que tes révélations sont spirituelles et non prophétiques. Garde un ton sérieux mais chaleureux, comme un sage qui connaît les secrets de l'univers.`,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  return data.content?.[0]?.text || "Les étoiles gardent silence pour l'instant...";
}

/* DRAWN CARDS */
.cards-row {

.tarot-card {

  animation: cardReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  opacity: 0;
  transform: rotateY(90deg) scale(0.8);
  cursor: default;
}

.tarot-card:nth-child(1) { animation-delay: 0.1s; }
.tarot-card:nth-child(2) { animation-delay: 0.35s; }
.tarot-card:nth-child(3) { animation-delay: 0.6s; }
.tarot-card:nth-child(4) { animation-delay: 0.85s; }
.tarot-card:nth-child(5) { animation-delay: 1.1s; }

@keyframes cardReveal {
  0% { opacity: 0; transform: rotateY(90deg) scale(0.8); }
  60% { opacity: 1; transform: rotateY(-5deg) scale(1.05); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1); }
}

.tarot-card.reversed { transform: rotate(180deg); }
.tarot-card.reversed { animation: cardRevealReversed 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }
@keyframes cardRevealReversed {
  0% { opacity: 0; transform: rotateY(90deg) scale(0.8) rotate(180deg); }
  60% { opacity: 1; transform: rotateY(-5deg) scale(1.05) rotate(180deg); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1) rotate(180deg); }
}

// ─── COMPONENTS ───────────────────────────────────────────────────────────────

function Stars() {
  const stars = Array.from({ length: 80 }, (_, i) => ({
    id: i,
    x: Math.random() * 100,
    y: Math.random() * 100,
    size: Math.random() * 2 + 0.5,
    dur: (Math.random() * 4 + 2).toFixed(1),
    maxOp: (Math.random() * 0.7 + 0.1).toFixed(2),
    delay: (Math.random() * 5).toFixed(1),
  }));
  return (
    <div className="stars-bg">
      {stars.map((s) => (
        <div key={s.id} className="star" style={{
          left: `${s.x}%`, top: `${s.y}%`,
          width: `${s.size}px`, height: `${s.size}px`,
          "--dur": `${s.dur}s`, "--max-op": s.maxOp,
          animationDelay: `${s.delay}s`,
        }} />
      ))}
    </div>
  );
}

function LoadingOracle({ text = "L'oracle consulte les astres" }) {
  return (
    <div className="loading-oracle">
      <div className="loading-dots"><span /><span /><span /></div>
      <span>{text}…</span>
    </div>
  );
}

// ─── TAROT CARD VISUAL ────────────────────────────────────────────────────────

// ─── TAROT TAB ────────────────────────────────────────────────────────────────
function TarotTab({ profile }) {
  const [selectedSpread, setSelectedSpread] = useState("single");
  const [drawnCards, setDrawnCards] = useState([]);
  const [interpSections, setInterpSections] = useState([]);
  const [loadingInterp, setLoadingInterp] = useState(false);
  const [phase, setPhase] = useState("choose"); // choose | drawn | done
  const [showPremiumLock, setShowPremiumLock] = useState(false);

  const spreadData = SPREADS.find(s => s.id === selectedSpread);
  const positions = SPREAD_POSITIONS[selectedSpread];

  const drawCards = () => {
    if (!spreadData.free) { setShowPremiumLock(true); return; }
    const shuffled = [...TAROT_DECK].sort(() => Math.random() - 0.5);
    const drawn = shuffled.slice(0, spreadData.count).map(card => ({
      ...card,
      isReversed: Math.random() < 0.3,
    }));
    setDrawnCards(drawn);
    setPhase("drawn");
    setInterpretation("");
    setShowPremiumLock(false);
    setTimeout(() => revealInterpretation(drawn), spreadData.count * 350 + 600);
  };

  const revealInterpretation = async (drawn) => {
    setLoadingInterp(true);
    setPhase("done");
    const spreadName = SPREADS.find(s => s.id === selectedSpread).label;
    const cardDescriptions = drawn.map((c, i) =>
      `Position ${i + 1} (${positions[i]}) : ${c.name}${c.isReversed ? " (inversée)" : ""} — ${c.keywords}`
    ).join("; ");
    const raw = await callClaude(
      `Interprète ce tirage de tarot pour ${profile.name}, ${profile.zodiac.name}, chemin de vie ${profile.numerology}.
Tirage : ${spreadName}. Cartes : ${cardDescriptions}.
Réponds UNIQUEMENT en JSON valide sans markdown :
{"energie":"2 phrases sur l'énergie générale du tirage","carte1":"2 phrases sur la première carte et sa position","carte2":"2 phrases sur la deuxième carte (si présente, sinon chaîne vide)","carte3":"2 phrases sur la troisième carte (si présente, sinon chaîne vide)","synthese":"2 phrases de synthèse et conseil final"}`
    );
    try {
      const d = JSON.parse(raw.replace(/\`\`\`json|\`\`\`/g,"").trim());
      const secs = [{ icon: "✦", title: "Énergie du Tirage", text: d.energie }];
      drawn.forEach((c, i) => {
        const key = i === 0 ? "carte1" : i === 1 ? "carte2" : "carte3";
        if (d[key]) secs.push({ icon: c.symbol, title: `${positions[i]} — ${c.name}`, text: d[key] });
      });
      secs.push({ icon: "🔮", title: "Synthèse & Conseil", text: d.synthese });
      setInterpSections(secs);
    } catch { setInterpSections([{ icon: "🔮", title: "Lecture", text: raw }]); }
    setLoadingInterp(false);
  };

  const reset = () => {
    setDrawnCards([]);
    setInterpSections([]);
    setPhase("choose");
    setShowPremiumLock(false);
  };

  return (
    <div className="section-animate">
      {/* Spread selector */}
      <div className="reading-box" style={{ marginBottom: "1.5rem" }}>
        <div className="reading-title"><span className="reading-title-icon">🃏</span> Choisissez votre Tirage</div>
        <div className="tarot-spread-selector">
          {SPREADS.map(s => (
            <div
              key={s.id}
              className={`spread-option${selectedSpread === s.id ? " selected" : ""}${!s.free ? " locked" : ""}`}
              onClick={() => { setSelectedSpread(s.id); reset(); }}
            >
              {!s.free && <span className="spread-lock-badge">Premium</span>}
              <div className="spread-option-name">{s.label}</div>
              <div style={{ fontSize: "1.4rem", margin: "0.4rem 0", opacity: 0.8 }}>
                {s.count === 1 ? "🃏" : s.count === 3 ? "🃏🃏🃏" : "🃏🃏🃏🃏🃏"}
              </div>
              <div className="spread-option-desc">{s.description}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Draw area */}
      {phase === "choose" && (
        <div className="reading-box" style={{ textAlign: "center" }}>
          <div className="reading-title" style={{ justifyContent: "center" }}>
            <span>✦</span> Concentrez-vous sur votre intention
          </div>
          <p style={{ color: "var(--text-dim)", fontStyle: "italic", fontSize: "1rem", marginBottom: "1.5rem" }}>
            Respirez profondément. Formulez mentalement votre question ou intention, puis laissez les cartes parler.
          </p>
          <div className="deck-area">
            <div className="deck-stack" onClick={drawCards}>
              <div className="deck-card-back"><div className="card-back-pattern">✦</div></div>
              <div className="deck-card-back"><div className="card-back-pattern">✦</div></div>
              <div className="deck-card-back"><div className="card-back-pattern">✦</div></div>
            </div>
          </div>
          <button className="draw-btn" onClick={drawCards}>
            ✦ Tirer les Cartes
          </button>

          {showPremiumLock && (
            <div style={{ marginTop: "1.5rem", background: "rgba(201,168,76,0.05)", border: "1px solid rgba(201,168,76,0.2)", borderRadius: "10px", padding: "1.5rem" }}>
              <div style={{ fontFamily: "'Cinzel', serif", fontSize: "0.85rem", color: "var(--gold)", letterSpacing: "0.15em", marginBottom: "0.5rem" }}>🔮 TIRAGE PREMIUM</div>
              <p style={{ color: "var(--text-dim)", fontStyle: "italic", marginBottom: "1rem" }}>La Croix Celtique révèle les mystères les plus profonds de votre situation.</p>
              <button className="btn-unlock">Débloquer — 4,99€</button>
            </div>
          )}
        </div>
      )}

      {/* Cards displayed */}
      {(phase === "drawn" || phase === "done") && drawnCards.length > 0 && (
        <div className="reading-box">
          <div className="reading-title"><span>✦</span> {spreadData.label}</div>
          <div className="cards-row">
            {drawnCards.map((card, i) => (
              <TarotCardVisual
                key={i}
                card={card}
                isReversed={card.isReversed}
                positionLabel={positions[i]}
              />
            ))}
          </div>
        </div>
      )}

      {/* Interpretation */}
      {(loadingInterp || interpSections.length > 0) && (
        <div className="tarot-interp">
          <div className="reading-title" style={{ justifyContent: "center", marginBottom: "1.2rem" }}>
            <span>🔮</span> Lecture de Séraphiel
          </div>
          <SectionedReading sections={interpSections} loading={loadingInterp} loadingText="Séraphiel lit les arcanes" />
          {!loadingInterp && (
            <button className="new-reading-btn" onClick={reset}>↩ Nouveau Tirage</button>
          )}
        </div>
      )}

      {/* Premium upsell for Celtic cross */}
      <div style={{ marginTop: "1.5rem" }} className="premium-overlay">
        <div className="reading-box premium-blur">
          <div className="reading-title"><span>🌙</span> Tirage de l'Année — 12 cartes</div>
          <p className="reading-text">Un tirage carte par carte pour chaque mois de l'année à venir, révélant les grandes tendances de votre destin…</p>
        </div>
        <div className="premium-lock">
          <div className="lock-icon">🌙</div>
          <div className="lock-title">Tirage Annuel</div>
          <div className="lock-text">12 cartes · 12 mois · Interprétation complète personnalisée</div>
          <button className="btn-unlock">Révéler mon Année — 14,99€</button>
        </div>
      </div>
    </div>
  );
}

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "1.2rem" }}>
      {sections.map((s, i) => (
        <div key={i} style={{ borderLeft: "2px solid rgba(201,168,76,0.3)", paddingLeft: "1rem" }}>
          <div style={{ fontFamily: "'Cinzel', serif", fontSize: "0.72rem", letterSpacing: "0.2em", color: "var(--gold)", textTransform: "uppercase", marginBottom: "0.45rem", display: "flex", alignItems: "center", gap: "0.5rem" }}>
            <span>{s.icon}</span> {s.title}
          </div>
          <p style={{ fontSize: "1.05rem", lineHeight: "1.75", color: "var(--text)", fontStyle: "italic", fontWeight: 300 }}>{s.text}</p>
        </div>
      ))}
    </div>
  );
}

// ─── STORAGE HELPERS ─────────────────────────────────────────────────────────
const STORAGE_KEY_DAILY = (name) => `seraphiel_daily_${name}`;
const STORAGE_KEY_MONTHLY = (name) => `seraphiel_monthly_${name}`;
const STORAGE_KEY_NOTIF = (name) => `seraphiel_notif_${name}`;

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}`;
}

// In-memory fallback when localStorage is unavailable (sandbox/iframe)
const memCache = {};

function loadCached(key) {
  if (memCache[key] !== undefined) return memCache[key];
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}

function saveCache(key, data) {
  memCache[key] = data;
  try { localStorage.setItem(key, JSON.stringify(data)); } catch {}
}

// ─── NOTIFICATION HELPERS ─────────────────────────────────────────────────────
async function requestNotifPermission() {
  if (typeof window === "undefined" || !("Notification" in window)) return "unsupported";
  if (window.Notification.permission === "granted") return "granted";
  if (window.Notification.permission === "denied") return "denied";
  try {
    const perm = await window.Notification.requestPermission();
    return perm;
  } catch { return "unsupported"; }
}

function scheduleNotifCheck(profile, hour, minute) {
  // Save schedule in localStorage, check on load
  const key = STORAGE_KEY_NOTIF(profile.name);
  saveCache(key, { hour, minute, zodiac: profile.zodiac.name, name: profile.name });
}

function sendTestNotif(name, zodiac) {
  if (typeof window === "undefined" || !("Notification" in window)) return;
  if (window.Notification.permission !== "granted") return;
  try {
    new window.Notification(`✦ Séraphiel — ${name}`, {
      body: `Votre horoscope du jour est prêt, ${zodiac}. Ouvrez l'application pour le découvrir.`,
    });
  } catch {}
}

      if (typeof window === "undefined" || !("Notification" in window)) return;
      if (window.Notification.permission !== "granted") return;
      try {
        const lsKeys = (() => { try { return Object.keys(localStorage); } catch { return []; } })();
        const allKeys = [...new Set([...lsKeys, ...Object.keys(memCache)])].filter(k => k.startsWith("seraphiel_notif_"));
        allKeys.forEach(key => {
          try {
            const data = JSON.parse(localStorage.getItem(key));

            const now = new Date();
            const sentKey = `seraphiel_sent_${data.name}_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            if (localStorage.getItem(sentKey)) return;
            if (now.getHours() === data.hour && now.getMinutes() === data.minute) {

    checkNotif();

  <script>
    // ── Service Worker inline (enregistré depuis un blob) ──
    const swCode = `
const CACHE = "seraphiel-v1";

self.addEventListener("install", e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(["/"]).catch(()=>{})));
});

self.addEventListener("activate", e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});

self.addEventListener("fetch", e => {
  if (e.request.url.includes("anthropic.com") || e.request.url.includes("unpkg.com") || e.request.url.includes("googleapis.com")) return;
  e.respondWith(
    fetch(e.request).then(r => {
      if (e.request.method === "GET") {
        const clone = r.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return r;
    }).catch(() => caches.match(e.request))
  );
});

self.addEventListener("message", e => {
  if (e.data && e.data.type === "CHECK_NOTIF") checkNotif();
});

async function checkNotif() {
  if (!self.registration || !self.registration.showNotification) return;
  try {
    const cache = await caches.open("seraphiel-notif");
    const keys = await cache.keys();
    const now = new Date();
    const todayKey = now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();
    for (const req of keys) {
      if (!req.url.includes("profile_")) continue;
      try {
        const res = await cache.match(req);
        const data = await res.json();
        const sentKey = "sent_"+data.name+"_"+todayKey;
        const already = await cache.match(sentKey).catch(()=>null);
        if (already) continue;
        if (now.getHours() === data.hour && now.getMinutes() === data.minute) {
          await self.registration.showNotification("\u2726 S\u00e9raphiel \u2014 " + data.name, {
            body: "Votre horoscope du jour est pr\u00eat, " + data.zodiac + ". Les astres vous parlent.",
            vibrate: [200, 100, 200],
            tag: "daily-" + data.name,
            data: { url: "/" }
          });
          await cache.put(sentKey, new Response(JSON.stringify({sent:true})));
        }
      } catch(e2) {}
    }
  } catch(e) {}
}

self.addEventListener("notificationclick", e => {
  e.notification.close();
  e.waitUntil(clients.matchAll({type:"window"}).then(list => {
    for (const c of list) { if ("focus" in c) return c.focus(); }
    if (clients.openWindow) return clients.openWindow("/");
  }));
});
`;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        try {
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          navigator.serviceWorker.register(swUrl, { scope: '/' })
            .then(reg => {
              console.log('✦ SW enregistré via blob');
              // Ping toutes les minutes pour les notifs
              setInterval(() => {
                if (navigator.serviceWorker.controller) {
                  navigator.serviceWorker.controller.postMessage({ type: 'CHECK_NOTIF' });
                }
              }, 60000);
            })
            .catch(err => {
              console.warn('SW blob non supporté, tentative fichier...', err);
              // Fallback: essaie le fichier si disponible
              navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
            });
        } catch(e) {
          console.warn('SW non disponible:', e);
        }
      });
    }
  </script>
